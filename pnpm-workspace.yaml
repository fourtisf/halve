# pnpm settings. pnpm 11 stopped reading pnpm settings from .npmrc and replaced
# onlyBuiltDependencies / ignoredBuiltDependencies with allowBuilds, so everything lives here;
# pnpm 10 reads this file too. package.json pins the pnpm version that produced the lockfile.

# The lockfile is pinned and installs run with --frozen-lockfile, so never reject an entry
# because it was published recently.
minimumReleaseAge: 0

# Optional native add-ons. The site builds and runs without them, so their install scripts never run.
allowBuilds:
  bufferutil: false
  keccak: false
  unrs-resolver: false
  utf-8-validate: false

# Patched versions of transitive packages flagged by `pnpm audit --prod`, all pulled in by wagmi's wallet
# connectors or Next's build tooling and none reachable from this site's runtime; the pins remove the noise.
overrides:
  axios: '>=1.18.0'
  ws: '>=8.21.0'
  postcss: '>=8.5.23'
  decode-uri-component: '>=0.5.0'
